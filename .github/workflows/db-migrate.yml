name: Database migrations

# Applies new files in backend/supabase/migrations to the hosted database when they land on main.
# Needs the repo secret SUPABASE_DB_URL: Supabase -> Connect -> Session pooler connection string.
on:
  push:
    branches: [main]
    paths: ["backend/supabase/migrations/**"]
  workflow_dispatch:

concurrency: db-migrate

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      # Without the secret there's nothing to connect to: say so instead of failing every push.
      # Migrations are then applied by hand (npm run db:push or the Supabase SQL editor).
      - if: env.SUPABASE_DB_URL == ''
        working-directory: .
        run: echo "::warning title=Migrations not applied::Set the repo secret SUPABASE_DB_URL (Supabase -> Connect -> Session pooler) to apply migrations on merge."
      - if: env.SUPABASE_DB_URL != ''
        uses: actions/checkout@v4
      - if: env.SUPABASE_DB_URL != ''
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - if: env.SUPABASE_DB_URL != ''
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
